
services:

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: inventory-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD}"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - inventory-keycloak-data:/opt/keycloak/data
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    restart: unless-stopped

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "127.0.0.1:11433:1433"
    volumes:
      - inventory-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null'
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: inventory-db-init
    user: "0:0"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    volumes:
      - ./docker/sql/init.sql:/scripts/init.sql:ro
    entrypoint:
      - /bin/bash
      - -c
    command:
      - |
        set -e
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd

        COUNT=$$($$SQLCMD -S sqlserver -U sa \
          -P "$$MSSQL_SA_PASSWORD" -C -b -h -1 -W \
          -Q "SET NOCOUNT ON; SELECT
          CASE WHEN OBJECT_ID('InventoryDB.dbo.Categories', 'U') IS NOT NULL THEN 1 ELSE 0 END +
          CASE WHEN OBJECT_ID('InventoryDB.dbo.Products', 'U') IS NOT NULL THEN 1 ELSE 0 END +
          CASE WHEN OBJECT_ID('InventoryDB.dbo.MovementTypes', 'U') IS NOT NULL THEN 1 ELSE 0 END +
          CASE WHEN OBJECT_ID('InventoryDB.dbo.InventoryMovements', 'U') IS NOT NULL THEN 1 ELSE 0 END;" |
          tr -d '[:space:]')

        if [ "$$COUNT" = "4" ]; then
          echo "InventoryDB tables already exist. Initialization skipped."
        elif [ "$$COUNT" = "0" ]; then
          echo "Initializing InventoryDB..."

          cp /scripts/init.sql /tmp/inventory-init.sql
          chmod 644 /tmp/inventory-init.sql

          $$SQLCMD -S sqlserver -U sa \
            -P "$$MSSQL_SA_PASSWORD" -C -b \
            -i /tmp/inventory-init.sql

          echo "InventoryDB initialized successfully."
        else
          echo "Partial database schema detected. Initialization aborted."
          exit 1
        fi

  api:
    build:
      context: .
      dockerfile: Inventory_Product.Api/Dockerfile
    image: inventory-product-api:local
    container_name: inventory-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=InventoryDB;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Keycloak__MetadataAddress: "http://inventory-keycloak:8080/realms/InventoryRealm/.well-known/openid-configuration"
    ports:
      - "127.0.0.1:5089:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_started
    restart: unless-stopped

volumes:
  inventory-sql-data:
  inventory-keycloak-data:
